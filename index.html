// ==================== ACADEMIC DOWNLOAD ====================
function downloadAcademicTemplate(template) {
  let txt = `${template.title.toUpperCase()}\n${'='.repeat(template.title.length)}\n\n${template.description}\n\n`;

  const blockToText = (block) => {
    switch (block.type) {
      case 'field':
        return `${block.label}: ____________________________________________\n\n`;
      case 'fields':
        return block.items.map(it => `${it.label}: __________________`).join('     ') + '\n\n';
      case 'box':
        return `${block.label}:\n` + '_'.repeat(70) + '\n'.repeat(block.rows || 3) + '\n';
      case 'heading':
        return `\n--- ${block.text.toUpperCase()} ---\n\n`;
      case 'note':
        return `Note: ${block.text}\n\n`;
      case 'table': {
        const headers = block.headers;
        const colWidths = headers.map(h => Math.max(h.length, 12));
        const sep = '+' + colWidths.map(w => '-'.repeat(w + 2)).join('+') + '+';
        const headerRow = '|' + headers.map((h, i) => ' ' + h.padEnd(colWidths[i]) + ' ').join('|') + '|';
        const emptyRow = '|' + colWidths.map(w => ' '.repeat(w + 2)).join('|') + '|';
        let out = sep + '\n' + headerRow + '\n' + sep + '\n';
        const rowCount = typeof block.rows === 'number' ? block.rows : (block.rows || []).length;
        for (let i = 0; i < rowCount; i++) {
          if (block.autoNumber) {
            let row = '|' + ' ' + String(i + 1).padEnd(colWidths[0]) + ' ';
            for (let j = 1; j < headers.length; j++) row += '|' + ' '.repeat(colWidths[j] + 2);
            out += row + '|\n';
          } else {
            out += emptyRow + '\n';
          }
        }
        out += sep + '\n\n';
        return out;
      }
      case 'tableData': {
        const headers = block.headers;
        const allRows = [headers, ...block.data];
        const colWidths = headers.map((_, i) => Math.max(...allRows.map(r => String(r[i] || '').length), 12));
        const sep = '+' + colWidths.map(w => '-'.repeat(w + 2)).join('+') + '+';
        const fmt = row => '|' + headers.map((_, i) => ' ' + String(row[i] || '').padEnd(colWidths[i]) + ' ').join('|') + '|';
        let out = sep + '\n' + fmt(headers) + '\n' + sep + '\n';
        block.data.forEach(r => { out += fmt(r) + '\n'; });
        out += sep + '\n\n';
        return out;
      }
      default:
        return '';
    }
  };

  template.blocks.forEach(b => { txt += blockToText(b); });

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${template.id}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ==================== ACADEMIC TEMPLATE VIEWER (table-aware) ====================
function AcademicTemplateViewer({ template, onClose, onDownload }) {
  const cat = ACADEMIC_CATEGORIES[template.category];

  const renderBlock = (block, idx) => {
    switch (block.type) {
      case 'heading':
        return (
          <h3 key={idx} className="text-base font-bold text-slate-900 mt-6 mb-2.5 flex items-center gap-2">
            <span className={`w-1.5 h-1.5 rounded-full bg-gradient-to-r ${cat.gradient}`} />
            {block.text}
          </h3>
        );
      case 'note':
        return (
          <div key={idx} className="my-3 px-3 py-2 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-900 italic leading-relaxed">
            {block.text}
          </div>
        );
      case 'field':
        return (
          <div key={idx} className="my-3">
            <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">{block.label}</div>
            <div className="h-9 rounded-lg border border-slate-200 bg-slate-50" />
          </div>
        );
      case 'fields':
        return (
          <div key={idx} className="my-3 grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(block.items.length, 4)}, minmax(0, 1fr))` }}>
            {block.items.map((item, i) => (
              <div key={i}>
                <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1 truncate">{item.label}</div>
                <div className="h-9 rounded-lg border border-slate-200 bg-slate-50" />
              </div>
            ))}
          </div>
        );
      case 'box':
        return (
          <div key={idx} className="my-3">
            <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">{block.label}</div>
            <div className="rounded-lg border border-slate-200 bg-slate-50" style={{ height: `${(block.rows || 3) * 22}px` }} />
          </div>
        );
      case 'table': {
        const rowCount = block.rows;
        return (
          <div key={idx} className="my-3 overflow-x-auto -mx-2 px-2">
            <table className="w-full border-collapse text-xs">
              <thead>
                <tr>
                  {block.headers.map((h, i) => (
                    <th key={i} className={`border border-slate-300 bg-gradient-to-r ${cat.gradient} text-white px-2 py-2 font-bold text-left whitespace-nowrap`}>
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {Array.from({ length: rowCount }).map((_, ri) => (
                  <tr key={ri}>
                    {block.headers.map((_, ci) => (
                      <td key={ci} className={`border border-slate-200 bg-white px-2 py-2 align-top ${block.headerCol && ci === 0 ? 'font-bold bg-slate-50 text-slate-700 whitespace-nowrap' : ''}`} style={{ minWidth: ci === 0 && block.headerCol ? '80px' : '100px', height: '32px' }}>
                        {block.autoNumber && ci === 0 ? ri + 1 : block.headerCol && ci === 0 && block.rows && Array.isArray(block.rows) ? (block.rows[ri] && block.rows[ri][0]) || '' : ''}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }
      case 'tableData': {
        return (
          <div key={idx} className="my-3 overflow-x-auto -mx-2 px-2">
            <table className="w-full border-collapse text-xs">
              <thead>
                <tr>
                  {block.headers.map((h, i) => (
                    <th key={i} className={`border border-slate-300 bg-gradient-to-r ${cat.gradient} text-white px-2 py-2 font-bold text-left whitespace-nowrap`}>
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {block.data.map((row, ri) => (
                  <tr key={ri}>
                    {block.headers.map((_, ci) => (
                      <td key={ci} className={`border border-slate-200 px-2 py-2 align-top ${row[ci] ? 'bg-slate-50 font-bold text-slate-700 whitespace-nowrap' : 'bg-white'}`} style={{ minWidth: '90px', height: '32px' }}>
                        {row[ci] || ''}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }
      default:
        return null;
    }
  };

  // Special-case: 'table' with headerCol uses block.rows array of label-only rows
  const renderTable = (block, idx) => {
    if (block.type !== 'table' || !block.headerCol || !Array.isArray(block.rows)) return renderBlock(block, idx);
    return (
      <div key={idx} className="my-3 overflow-x-auto -mx-2 px-2">
        <table className="w-full border-collapse text-xs">
          <thead>
            <tr>
              {block.headers.map((h, i) => (
                <th key={i} className={`border border-slate-300 bg-gradient-to-r ${cat.gradient} text-white px-2 py-2 font-bold text-left whitespace-nowrap`}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {block.rows.map((row, ri) => (
              <tr key={ri}>
                {block.headers.map((_, ci) => (
                  <td key={ci} className={`border border-slate-200 px-2 py-2 align-top ${ci === 0 ? 'bg-slate-50 font-bold text-slate-700 whitespace-nowrap' : 'bg-white'}`} style={{ minWidth: ci === 0 ? '80px' : '90px', height: '32px' }}>
                    {ci === 0 ? row[0] : ''}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md p-4 overflow-y-auto" onClick={onClose}>
      <div className="max-w-4xl mx-auto my-8 bg-white rounded-3xl shadow-2xl overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className={`bg-gradient-to-r ${cat.gradient} p-6 md:p-8 text-white relative`}>
          <button onClick={onClose} className="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-sm flex items-center justify-center transition">
            <X className="w-5 h-5" />
          </button>
          <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-white/20 backdrop-blur-sm mb-3">
            <cat.icon className="w-3 h-3" />
            {cat.label}
          </div>
          <h2 className="text-2xl md:text-3xl font-bold leading-tight mb-2">{template.title}</h2>
          <p className="text-white/90 text-sm md:text-base leading-relaxed">{template.description}</p>
        </div>

        <div className="p-6 md:p-8 max-h-[65vh] overflow-y-auto">
          {template.blocks.map((b, i) => renderTable(b, i))}
        </div>

        <div className="p-4 md:p-6 border-t border-slate-100 bg-slate-50 flex flex-col sm:flex-row gap-3">
          <button onClick={onClose} className="flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-xl border-2 border-slate-200 text-slate-700 hover:bg-white hover:border-slate-300 transition font-semibold">
            Close
          </button>
          <button onClick={() => onDownload(template)} className={`flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-gradient-to-r ${cat.gradient} text-white hover:opacity-90 transition font-bold shadow-lg`}>
            <Download className="w-4 h-4" />
            Download as .txt
          </button>
        </div>
      </div>
    </div>
  );
}

function AuthScreen({ users, onLogin, onSignUp, onClose, isModal, contextMessage }) {
  const [mode, setMode] = useState('signin');
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    setError('');

    if (!email.trim() || !password) {
      setError('Please fill in all required fields.');
      return;
    }

    const emailLower = email.trim().toLowerCase();

    if (mode === 'signup') {
      if (!name.trim()) {
        setError('Please enter your name.');
        return;
      }
      if (password.length < 6) {
        setError('Password must be at least 6 characters.');
        return;
      }
      if (users[emailLower]) {
        setError('An account with this email already exists. Try signing in.');
        return;
      }
      onSignUp({ email: emailLower, name: name.trim(), password });
    } else {
      const user = users[emailLower];
      if (!user) {
        setError('No account found with that email. Try signing up.');
        return;
      }
      if (user.password !== password) {
        setError('Incorrect password.');
        return;
      }
      onLogin(emailLower);
    }
  };

  const switchMode = (newMode) => {
    setMode(newMode);
    setError('');
    setPassword('');
  };

  const wrapperClass = isModal
    ? "fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md overflow-y-auto"
    : "min-h-screen relative bg-gradient-to-br from-slate-900 via-violet-900 to-slate-900 flex items-center justify-center p-4 overflow-hidden";

  return (

            <ArrowLeft className="w-4 h-4" />

        <div className="text-center mb-6">

            <Sparkles className="w-3.5 h-3.5 text-amber-300" />
            <span>Work Playbooks</span>

          <h1 className="text-3xl md:text-4xl font-bold text-white mb-2 leading-tight">
            {mode === 'signup' ? 'Create your account' : 'Welcome back'}

          <p className="text-slate-300 text-base">
            {contextMessage || (mode === 'signup' ? 'Start running playbooks in under a minute.' : 'Pick up where you left off.')}
          </p>
        </div>

        <div className="bg-white rounded-3xl shadow-2xl p-7 md:p-8">
          <div className="flex bg-slate-100 rounded-xl p-1 mb-6">
            <button type="button" onClick={() => switchMode('signin')} className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${mode === 'signin' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
              Sign in
            </button>
            <button type="button" onClick={() => switchMode('signup')} className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${mode === 'signup' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>

function App() {
  // Persisted state (loaded from IndexedDB)
  const [users, setUsers] = useState({});
  const [currentUser, setCurrentUser] = useState(null);
  const [dataLoaded, setDataLoaded] = useState(false);

  // UI state
  const [view, setView] = useState('library');
  const [section, setSection] = useState('playbooks');
  const [activePlaybook, setActivePlaybook] = useState(null);
  const [activeStep, setActiveStep] = useState(0);
  const [activeTemplate, setActiveTemplate] = useState(null);
  const [activeCheatSheet, setActiveCheatSheet] = useState(null);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [templateFilter, setTemplateFilter] = useState('all');
  const [cheatSheetFilter, setCheatSheetFilter] = useState('all');
  const [showCelebration, setShowCelebration] = useState(false);
  const [showAccountMenu, setShowAccountMenu] = useState(false);
  const [showAuthGate, setShowAuthGate] = useState(false);
  const [pendingPlaybook, setPendingPlaybook] = useState(null);
  const [pendingTemplate, setPendingTemplate] = useState(null);
  const [pendingCheatSheet, setPendingCheatSheet] = useState(null);
  const [browsingCategory, setBrowsingCategory] = useState(null);
  const [browsingAcademicCategory, setBrowsingAcademicCategory] = useState(null);
  const [activeAcademicTemplate, setActiveAcademicTemplate] = useState(null);
  const [academicFilter, setAcademicFilter] = useState('all');
  const [pendingAcademicTemplate, setPendingAcademicTemplate] = useState(null);

  // PWA install state
  const [installPrompt, setInstallPrompt] = useState(null);
  const [showInstallBanner, setShowInstallBanner] = useState(false);

  const dailyQuote = getDailyQuote();

  // Load data from IndexedDB on mount
  useEffect(() => {
    (async () => {
      try {
        const loadedUsers = await dbGetAllUsers();
        const sessionEmail = await dbGetSession();
        setUsers(loadedUsers);
        if (sessionEmail && loadedUsers[sessionEmail]) {
          setCurrentUser(sessionEmail);
        }
      } catch (err) {
        console.warn('IndexedDB load failed:', err);
      }
      setDataLoaded(true);
    })();
  }, []);

  // PWA install prompt capture
  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      setInstallPrompt(e);
      // Show banner only if user hasn't dismissed recently
      try {
        const dismissed = localStorage.getItem('wp-install-dismissed');
        if (!dismissed || (Date.now() - parseInt(dismissed, 10)) > 7 * 24 * 3600 * 1000) {
          setShowInstallBanner(true);
        }
      } catch (e) {
        setShowInstallBanner(true);
      }
    };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const handleInstall = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) {}
    setInstallPrompt(null);
    setShowInstallBanner(false);
  };

  const dismissInstall = () => {
    setShowInstallBanner(false);
    try { localStorage.setItem('wp-install-dismissed', String(Date.now())); } catch (e) {}
  };

  // Persist users to IndexedDB whenever a single user changes
  const persistUser = async (email, userObj) => {
    try {
      await dbPutUser({ ...userObj, email });
    } catch (err) {
      console.warn('Failed to persist user:', err);
    }
  };

  // Persist session
  const persistSession = async (email) => {
    try {
      await dbSetSession(email);
    } catch (err) {
      console.warn('Failed to persist session:', err);
    }
  };

  const handleSignUp = async ({ email, name, password }) => {
    const newUser = { email, name, password, progress: {} };
    const updatedUsers = { ...users, [email]: newUser };
    setUsers(updatedUsers);
    setCurrentUser(email);
    await dbPutUser(newUser);
    await persistSession(email);

    setShowAuthGate(false);
    if (pendingPlaybook) {
      openPlaybook(pendingPlaybook);
      setPendingPlaybook(null);
    } else if (pendingTemplate) {
      setActiveTemplate(pendingTemplate);
      setPendingTemplate(null);
    } else if (pendingCheatSheet) {
      setActiveCheatSheet(pendingCheatSheet);
      setPendingCheatSheet(null);
    } else if (pendingAcademicTemplate) {
      setActiveAcademicTemplate(pendingAcademicTemplate);
      setPendingAcademicTemplate(null);
    }
  };

  const handleLogin = async (email) => {
    setCurrentUser(email);
    await persistSession(email);

    setShowAuthGate(false);
    if (pendingPlaybook) {
      openPlaybook(pendingPlaybook);
      setPendingPlaybook(null);
    } else if (pendingTemplate) {
      setActiveTemplate(pendingTemplate);
      setPendingTemplate(null);
    } else if (pendingCheatSheet) {
      setActiveCheatSheet(pendingCheatSheet);
      setPendingCheatSheet(null);
    } else if (pendingAcademicTemplate) {
      setActiveAcademicTemplate(pendingAcademicTemplate);
      setPendingAcademicTemplate(null);
    }
  };

  const handleLogout = async () => {
    setCurrentUser(null);
    setShowAccountMenu(false);
    setView('library');
    setActivePlaybook(null);
    setActiveStep(0);
    try { await dbSetSession(null); } catch (e) {}
  };

  const updateProgress = async (playbookId, stepIdx, value) => {
    if (!currentUser) return;
    const user = users[currentUser];
    if (!user) return;

    const currentProgress = user.progress?.[playbookId] || { steps: {}, completed: 0, lastStep: 0 };
    const newSteps = { ...currentProgress.steps, [stepIdx]: value };
    const completed = Object.values(newSteps).filter(Boolean).length;

    const updatedUser = {
      ...user,
      progress: {
        ...user.progress,
        [playbookId]: { steps: newSteps, completed, lastStep: stepIdx }
      }
    };
    const updatedUsers = { ...users, [currentUser]: updatedUser };
    setUsers(updatedUsers);
    await persistUser(currentUser, updatedUser);
  };

  const updateLastStep = async (playbookId, stepIdx) => {
    if (!currentUser) return;
    const user = users[currentUser];
    if (!user) return;
    const currentProgress = user.progress?.[playbookId] || { steps: {}, completed: 0, lastStep: 0 };
    const updatedUser = {
      ...user,
      progress: {
        ...user.progress,
        [playbookId]: { ...currentProgress, lastStep: stepIdx }
      }
    };
    setUsers({ ...users, [currentUser]: updatedUser });
    await persistUser(currentUser, updatedUser);
  };

  const resetPlaybook = async (playbookId) => {
    if (!currentUser) return;
    const user = users[currentUser];
    if (!user) return;
    const updatedUser = {
      ...user,
      progress: {
        ...user.progress,
        [playbookId]: { steps: {}, completed: 0, lastStep: 0 }
      }
    };
    setUsers({ ...users, [currentUser]: updatedUser });
    setActiveStep(0);
    await persistUser(currentUser, updatedUser);
  };

  const openPlaybook = (playbook) => {
    setActivePlaybook(playbook);
    const userProgress = currentUser ? users[currentUser]?.progress?.[playbook.id] : null;
    setActiveStep(userProgress?.lastStep || 0);
    setView('runner');
    setShowCelebration(false);
  };

  const handlePlaybookClick = (playbook) => {
    if (!currentUser) {
      setPendingPlaybook(playbook);
      setShowAuthGate(true);
      return;
    }
    openPlaybook(playbook);
  };

  const handleTemplateClick = (template) => {
    if (!currentUser) {
      setPendingTemplate(template);
      setShowAuthGate(true);
      return;
    }
    setActiveTemplate(template);
  };

  const handleCheatSheetClick = (cs) => {
    if (!currentUser) {
      setPendingCheatSheet(cs);
      setShowAuthGate(true);
      return;
    }
    setActiveCheatSheet(cs);
  };

  const goNext = () => {
    if (!activePlaybook) return;
    if (activeStep < activePlaybook.steps.length - 1) {
      const next = activeStep + 1;
      setActiveStep(next);
      updateLastStep(activePlaybook.id, next);
    } else {
      setShowCelebration(true);
    }
  };

  const goPrev = () => {
    if (activeStep > 0) {
      const prev = activeStep - 1;
      setActiveStep(prev);
      updateLastStep(activePlaybook.id, prev);
    }
  };

  const toggleStepComplete = () => {
    if (!activePlaybook || !currentUser) return;
    const userProgress = users[currentUser]?.progress?.[activePlaybook.id] || { steps: {} };
    updateProgress(activePlaybook.id, activeStep, !userProgress.steps[activeStep]);
  };

  // Filtering
  const filteredPlaybooks = PLAYBOOKS.filter((pb) => {
    if (browsingCategory && pb.category !== browsingCategory) return false;
    if (filter !== 'all' && pb.category !== filter) return false;
    if (search) {
      const q = search.toLowerCase();
      return pb.title.toLowerCase().includes(q) ||
        pb.description.toLowerCase().includes(q);
    }
    return true;
  });

  const filteredTemplates = TEMPLATES.filter((t) => {
    if (templateFilter !== 'all' && t.category !== templateFilter) return false;
    if (search) {
      const q = search.toLowerCase();
      return t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q);
    }
    return true;
  });

  const filteredCheatSheets = CHEAT_SHEETS.filter((cs) => {
    if (cheatSheetFilter !== 'all' && cs.category !== cheatSheetFilter) return false;
    if (search) {
      const q = search.toLowerCase();
      return cs.title.toLowerCase().includes(q) || cs.description.toLowerCase().includes(q);
    }
    return true;
  });

  // Related playbooks (from curated 'related' field, falls back to same category)
  const relatedPlaybooks = activePlaybook
    ? (activePlaybook.related && activePlaybook.related.length > 0
        ? activePlaybook.related.map(id => PLAYBOOKS.find(p => p.id === id)).filter(Boolean).slice(0, 3)
        : PLAYBOOKS.filter((p) => p.category === activePlaybook.category && p.id !== activePlaybook.id).slice(0, 3))
    : [];

  // ==================== LOADING SCREEN ====================
  if (!dataLoaded) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 via-violet-900 to-slate-900 flex items-center justify-center">
        <div className="text-center">
          <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-fuchsia-500 to-violet-600 mb-4 shadow-lg shadow-fuchsia-500/30 animate-pulse">
            <Sparkles className="w-8 h-8 text-white" />
          </div>
          <p className="text-white/70 text-sm">Loading your playbooks…</p>
        </div>
      </div>
    );
  }

  // ==================== ENTRY AUTH SCREEN (no user, not browsing) ====================
  // We let users browse the library without an account; auth gates appear when they try to open something.

  // ==================== RUNNER VIEW ====================
  if (view === 'runner' && activePlaybook) {
    const step = activePlaybook.steps[activeStep];
    const userProgress = currentUser ? users[currentUser]?.progress?.[activePlaybook.id] || { steps: {}, completed: 0 } : { steps: {}, completed: 0 };
    const cat = CATEGORIES[activePlaybook.category];
    const totalSteps = activePlaybook.steps.length;
    const progressPct = ((activeStep + 1) / totalSteps) * 100;
    const isLastStep = activeStep === totalSteps - 1;
    const isStepDone = userProgress.steps[activeStep];

    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-violet-50 pb-32">
        {/* Top bar */}
        <div className="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200">
          <div className="max-w-3xl mx-auto px-4 md:px-6 py-3">
            <div className="flex items-center justify-between gap-3 mb-3">
              <button onClick={() => { setView('library'); setActivePlaybook(null); }} className="flex items-center gap-1.5 text-slate-600 hover:text-slate-900 text-sm font-medium transition">
                <ArrowLeft className="w-4 h-4" />
                Library
              </button>
              <div className="flex items-center gap-2">
                <button onClick={() => resetPlaybook(activePlaybook.id)} className="p-2 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition" title="Reset playbook">
                  <RotateCcw className="w-4 h-4" />
                </button>
                <div className="text-xs text-slate-500 font-medium">
                  Step {activeStep + 1} of {totalSteps}
                </div>
              </div>
            </div>
            <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
              <div className={`h-full bg-gradient-to-r ${cat.gradient} transition-all duration-500`} style={{ width: `${progressPct}%` }} />
            </div>
          </div>
        </div>

        {/* Step card */}
        <div className="max-w-3xl mx-auto px-4 md:px-6 pt-6">
          <div className="mb-5">
            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-700 mb-3">
              <cat.icon className="w-3 h-3" />
              {cat.label}
            </div>
            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 leading-tight">{activePlaybook.title}</h1>
          </div>

          <div className="bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-6 md:p-8 mb-6">
            <div className="flex items-start gap-3 mb-5">
              <StepIcon type={step.type} />
              <div className="flex-1">
                <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">
                  {step.type === 'checklist' ? 'Checklist' : step.type === 'reference' ? 'Reference' : 'Step'}
                </div>
                <h2 className="text-xl md:text-2xl font-bold text-slate-900 leading-tight">{step.title}</h2>
              </div>
            </div>

            <p className="text-slate-700 leading-relaxed text-base md:text-lg mb-5 whitespace-pre-line">{step.body}</p>

            {step.items && step.items.length > 0 && (
              <ul className="space-y-2 mb-5">
                {step.items.map((item, i) => (
                  <li key={i} className="flex items-start gap-2.5 p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <div className="w-5 h-5 rounded-full border-2 border-fuchsia-400 flex-shrink-0 mt-0.5 flex items-center justify-center">
                      <span className="text-xs font-bold text-fuchsia-500">{i + 1}</span>
                    </div>
                    <span className="text-sm text-slate-700 leading-relaxed">{item}</span>
                  </li>
                ))}
              </ul>
            )}

            {step.example && (
              <div className="rounded-2xl bg-gradient-to-br from-indigo-50 to-violet-50 border border-indigo-100 p-4 mb-3">
                <div className="text-xs font-bold uppercase tracking-wider text-indigo-700 mb-1.5 flex items-center gap-1.5">
                  <Sparkles className="w-3 h-3" />
                  Example
                </div>
                <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-line">{step.example}</p>
              </div>
            )}

            {step.watchout && (
              <div className="rounded-2xl bg-gradient-to-br from-rose-50 to-orange-50 border border-rose-100 p-4 mb-3">
                <div className="text-xs font-bold uppercase tracking-wider text-rose-700 mb-1.5 flex items-center gap-1.5">
                  <AlertCircle className="w-3 h-3" />
                  Watch out
                </div>
                <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-line">{step.watchout}</p>
              </div>
            )}

            {step.tip && (
              <div className="rounded-2xl bg-gradient-to-br from-amber-50 to-yellow-50 border border-amber-200 p-4">
                <div className="text-xs font-bold uppercase tracking-wider text-amber-700 mb-1.5 flex items-center gap-1.5">
                  <Flame className="w-3 h-3" />
                  Pro tip
                </div>
                <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-line">{step.tip}</p>
              </div>
            )}

            <button onClick={toggleStepComplete} className={`mt-6 w-full flex items-center justify-center gap-2 py-3 rounded-xl font-bold transition-all ${isStepDone ? 'bg-emerald-50 text-emerald-700 border-2 border-emerald-200' : `bg-gradient-to-r ${cat.gradient} text-white shadow-lg hover:opacity-90`}`}>
              {isStepDone ? <><CheckCircle2 className="w-5 h-5" /> Step completed</> : <><Circle className="w-5 h-5" /> Mark as done</>}
            </button>
          </div>

          {/* Step navigator dots */}
          <div className="flex flex-wrap gap-1.5 justify-center mb-8">
            {activePlaybook.steps.map((_, idx) => {
              const done = userProgress.steps[idx];
              const isCurrent = idx === activeStep;
              return (
                <button key={idx} onClick={() => { setActiveStep(idx); updateLastStep(activePlaybook.id, idx); }} className={`h-2 rounded-full transition-all ${isCurrent ? `w-8 bg-gradient-to-r ${cat.gradient}` : done ? 'w-2 bg-emerald-400' : 'w-2 bg-slate-200 hover:bg-slate-300'}`} title={`Step ${idx + 1}`} />
              );
            })}
          </div>

          {/* Related playbooks on last step */}
          {isLastStep && relatedPlaybooks.length > 0 && (
            <div className="mb-8">
              <h3 className="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                <Sparkles className="w-4 h-4 text-amber-500" />
                Try next
              </h3>
              <div className="grid gap-3">
                {relatedPlaybooks.map((pb) => {
                  const pbCat = CATEGORIES[pb.category];
                  return (
                    <button key={pb.id} onClick={() => openPlaybook(pb)} className="text-left bg-white rounded-2xl p-4 border border-slate-200 hover:border-violet-300 hover:shadow-lg transition-all group">
                      <div className="flex items-start gap-3">
                        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${pbCat.gradient} flex items-center justify-center flex-shrink-0`}>
                          <pbCat.icon className="w-5 h-5 text-white" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="font-bold text-slate-900 group-hover:text-violet-700 transition">{pb.title}</div>
                          <div className="text-xs text-slate-500 mt-0.5 line-clamp-1">{pb.description}</div>
                        </div>
                        <ArrowRight className="w-4 h-4 text-slate-400 group-hover:text-violet-600 group-hover:translate-x-0.5 transition flex-shrink-0" />
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* Bottom navigation */}
        <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-20">
          <div className="max-w-3xl mx-auto px-4 md:px-6 py-3 flex gap-3">
            <button onClick={goPrev} disabled={activeStep === 0} className="flex-1 flex items-center justify-center gap-1.5 py-3 rounded-xl border-2 border-slate-200 text-slate-700 font-semibold hover:bg-slate-50 transition disabled:opacity-40 disabled:cursor-not-allowed">
              <ArrowLeft className="w-4 h-4" />
              Previous
            </button>
            <button onClick={goNext} className={`flex-[1.5] flex items-center justify-center gap-1.5 py-3 rounded-xl bg-gradient-to-r ${cat.gradient} text-white font-bold shadow-lg hover:opacity-90 transition`}>
              {isLastStep ? <>Finish <Trophy className="w-4 h-4" /></> : <>Next step <ArrowRight className="w-4 h-4" /></>}
            </button>
          </div>
        </div>

        {/* Celebration modal */}
        {showCelebration && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md p-4" onClick={() => setShowCelebration(false)}>
            <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center relative overflow-hidden" onClick={(e) => e.stopPropagation()}>
              <div className="absolute -top-12 -right-12 w-48 h-48 rounded-full bg-gradient-to-br from-amber-300 to-pink-400 opacity-20 blur-3xl" />
              <div className="absolute -bottom-12 -left-12 w-48 h-48 rounded-full bg-gradient-to-br from-violet-400 to-cyan-300 opacity-20 blur-3xl" />
              <div className="relative">
                <div className="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-br from-amber-400 via-pink-500 to-violet-600 mb-4 shadow-lg shadow-pink-500/30">
                  <Trophy className="w-10 h-10 text-white" />
                </div>
                <h2 className="text-2xl font-bold text-slate-900 mb-2">Nicely done!</h2>
                <p className="text-slate-600 mb-6 leading-relaxed">You finished the {activePlaybook.title} playbook. Your progress is saved.</p>
                <div className="flex flex-col sm:flex-row gap-2">
                  <button onClick={() => { setShowCelebration(false); setView('library'); setActivePlaybook(null); }} className="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white font-bold hover:opacity-90 transition shadow-lg">
                    Back to library
                  </button>
                  <button onClick={() => setShowCelebration(false)} className="flex-1 px-4 py-3 rounded-xl border-2 border-slate-200 text-slate-700 font-semibold hover:bg-slate-50 transition">
                    Stay here
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ==================== LIBRARY VIEW ====================
  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-violet-50">
      {/* Hero */}
      <div className="relative overflow-hidden bg-gradient-to-br from-slate-900 via-violet-900 to-slate-900 text-white">
        <HeroBlob />
        <HeroBlob2 />
        <div className="relative max-w-6xl mx-auto px-4 md:px-6 pt-6 pb-10">
          <div className="flex items-center justify-between mb-8">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-white/90 text-xs font-medium">
              <Sparkles className="w-3.5 h-3.5 text-amber-300" />
              <span>Work Playbooks</span>
            </div>
            <div className="flex items-center gap-2">
              {currentUser ? (
                <div className="relative">
                  <button onClick={() => setShowAccountMenu((v) => !v)} className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/20 text-white text-sm font-semibold transition">
                    <div className="w-6 h-6 rounded-full bg-gradient-to-br from-fuchsia-400 to-pink-500 flex items-center justify-center text-xs font-bold">
                      {users[currentUser]?.name?.[0]?.toUpperCase() || '?'}
                    </div>
                    <span className="hidden sm:inline">{users[currentUser]?.name?.split(' ')[0]}</span>
                  </button>
                  {showAccountMenu && (
                    <div className="absolute right-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
                      <div className="px-4 py-3 border-b border-slate-100">
                        <div className="font-bold text-slate-900 text-sm">{users[currentUser]?.name}</div>
                        <div className="text-xs text-slate-500 truncate">{currentUser}</div>
                      </div>
                      {installPrompt && (
                        <button onClick={handleInstall} className="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-violet-50 flex items-center gap-2 transition">
                          <Plus className="w-4 h-4" />
                          Install app
                        </button>
                      )}
                      <button onClick={handleLogout} className="w-full px-4 py-2.5 text-left text-sm text-rose-600 hover:bg-rose-50 flex items-center gap-2 transition">
                        <LogOut className="w-4 h-4" />
                        Sign out
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <button onClick={() => setShowAuthGate(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white text-violet-700 text-sm font-bold hover:bg-amber-50 transition shadow-lg">
                  <LogIn className="w-4 h-4" />
                  Sign in
                </button>
              )}
            </div>
          </div>

          <h1 className="text-3xl md:text-5xl font-bold leading-tight mb-3 max-w-2xl">
            Step-by-step playbooks for the work that actually moves things.
          </h1>
          <p className="text-slate-300 text-base md:text-lg max-w-2xl leading-relaxed">
            Change management. Business analysis. Process improvement. Run them like a recipe — one step at a time.
          </p>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 md:px-6 -mt-6 relative z-10">
        {/* Section tabs */}
        <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-1.5 inline-flex gap-1 mb-6">
          <button onClick={() => { setSection('playbooks'); setBrowsingCategory(null); setSearch(''); }} className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold transition ${section === 'playbooks' ? 'bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}>
            <BookOpen className="w-4 h-4" />
            Playbooks
          </button>
          <button onClick={() => { setSection('templates'); setSearch(''); }} className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold transition ${section === 'templates' ? 'bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}>
            <FileText className="w-4 h-4" />
            Templates
          </button>
          <button onClick={() => { setSection('academic'); setBrowsingAcademicCategory(null); setSearch(''); setAcademicFilter('all'); }} className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold transition ${section === 'academic' ? 'bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}>
            <Calculator className="w-4 h-4" />
            Academic
          </button>
          <button onClick={() => { setSection('cheatsheets'); setSearch(''); }} className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold transition ${section === 'cheatsheets' ? 'bg-gradient-to-r from-fuchsia-500 to-violet-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'}`}>
            <Database className="w-4 h-4" />
            Cheat sheets
          </button>
        </div>

        {/* Quote widget */}
        <DailyQuoteWidget quote={dailyQuote} />

        {/* PLAYBOOKS SECTION */}
        {section === 'playbooks' && (
          <>
            {/* Category landing (no search, no category chosen) */}
            {!browsingCategory && !search && filter === 'all' ? (
              <>
                <h2 className="text-2xl font-bold text-slate-900 mb-4">Choose a discipline</h2>
                <div className="grid md:grid-cols-3 gap-4 mb-12">
                  {Object.entries(CATEGORIES).map(([key, cat]) => {
                    const count = PLAYBOOKS.filter((p) => p.category === key).length;
                    const Illustration = key === 'change' ? ChangeIllustration : key === 'ba' ? BAIllustration : PIIllustration;
                    return (
                      <button key={key} onClick={() => setBrowsingCategory(key)} className="relative overflow-hidden text-left bg-white rounded-3xl p-6 border border-slate-200 hover:border-violet-300 hover:shadow-2xl transition-all group">
                        <Illustration className="absolute top-0 right-0 w-32 h-24 opacity-60 group-hover:opacity-100 transition" />
                        <div className={`relative inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br ${cat.gradient} mb-4 shadow-lg`}>
                          <cat.icon className="w-6 h-6 text-white" />
                        </div>
                        <h3 className="relative font-bold text-slate-900 text-xl mb-1.5">{cat.label}</h3>
                        <p className="relative text-slate-600 text-sm leading-relaxed mb-4">{cat.description}</p>
                        <div className="relative flex items-center justify-between">
                          <span className="text-xs text-slate-500 font-semibold">{count} playbook{count === 1 ? '' : 's'}</span>
                          <ArrowRight className="w-4 h-4 text-slate-400 group-hover:text-violet-600 group-hover:translate-x-1 transition" />
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* Quick search */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200 mb-6">
                  <div className="relative">
                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search all playbooks…" className="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-violet-400 focus:bg-white transition text-slate-900 placeholder:text-slate-400 text-sm" />
                  </div>
                </div>
              </>
            ) : (
              <>
                {/* Category nav + search */}
                <div className="flex flex-col md:flex-row md:items-center gap-3 mb-6">
                  {browsingCategory && (
                    <button onClick={() => { setBrowsingCategory(null); setSearch(''); setFilter('all'); }} className="self-start flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-white transition">
                      <ArrowLeft className="w-4 h-4" />
                      All disciplines
                    </button>
                  )}
                  <div className="relative flex-1">
                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search playbooks…" className="w-full pl-11 pr-4 py-3 rounded-xl bg-white border border-slate-200 focus:outline-none focus:border-violet-400 transition text-slate-900 placeholder:text-slate-400 text-sm" />
                  </div>
                </div>

                {!browsingCategory && (
                  <div className="flex flex-wrap gap-2 mb-6">
                    <button onClick={() => setFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${filter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>All</button>
                    {Object.entries(CATEGORIES).map(([key, cat]) => (
                      <button key={key} onClick={() => setFilter(key)} className={`px-3 py-1.5 rounded-full text-xs font-bold transition inline-flex items-center gap-1.5 ${filter === key ? `bg-gradient-to-r ${cat.gradient} text-white` : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
                        <cat.icon className="w-3 h-3" />
                        {cat.label}
                      </button>
                    ))}
                  </div>
                )}

                {browsingCategory && (
                  <div className="mb-5">
                    {(() => {
                      const cat = CATEGORIES[browsingCategory];
                      return (
                        <div className="flex items-center gap-3">
                          <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center shadow-lg`}>
                            <cat.icon className="w-6 h-6 text-white" />
                          </div>
                          <div>
                            <h2 className="text-2xl font-bold text-slate-900">{cat.label}</h2>
                            <p className="text-slate-500 text-sm">{cat.description}</p>
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                )}

                {/* Playbook cards */}
                <div className="grid md:grid-cols-2 gap-4 mb-12">
                  {filteredPlaybooks.map((pb) => {
                    const cat = CATEGORIES[pb.category];
                    const userProgress = currentUser ? users[currentUser]?.progress?.[pb.id] : null;
                    const completed = userProgress?.completed || 0;
                    const total = pb.steps.length;
                    const pct = total > 0 ? (completed / total) * 100 : 0;
                    return (
                      <button key={pb.id} onClick={() => handlePlaybookClick(pb)} className="text-left bg-white rounded-2xl p-5 border border-slate-200 hover:border-violet-300 hover:shadow-xl transition-all group">
                        <div className="flex items-start gap-3 mb-3">
                          <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center flex-shrink-0 shadow`}>
                            <cat.icon className="w-5 h-5 text-white" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-0.5">{cat.label}</div>
                            <h3 className="font-bold text-slate-900 leading-tight group-hover:text-violet-700 transition">{pb.title}</h3>
                          </div>
                        </div>
                        <p className="text-slate-600 text-sm leading-relaxed mb-4 line-clamp-2">{pb.description}</p>
                        <div className="flex items-center gap-3 text-xs text-slate-500 mb-3">
                          <span className="flex items-center gap-1"><Clock className="w-3 h-3" /> {pb.estMinutes} min</span>
                          <span className="flex items-center gap-1"><Target className="w-3 h-3" /> {total} steps</span>
                        </div>
                        {completed > 0 && (
                          <div>
                            <div className="flex items-center justify-between text-xs mb-1">
                              <span className="text-slate-500 font-semibold">{completed}/{total} done</span>
                              {completed === total && <span className="text-emerald-600 font-bold flex items-center gap-0.5"><CheckCircle2 className="w-3 h-3" /> Complete</span>}
                            </div>
                            <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
                              <div className={`h-full bg-gradient-to-r ${cat.gradient}`} style={{ width: `${pct}%` }} />
                            </div>
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>

                {filteredPlaybooks.length === 0 && (
                  <div className="text-center py-12 text-slate-500">
                    <Search className="w-8 h-8 mx-auto mb-3 text-slate-300" />
                    <p>No playbooks match your search.</p>
                  </div>
                )}
              </>
            )}
          </>
        )}

        {/* TEMPLATES SECTION */}
        {section === 'templates' && (
          <>
            <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-violet-900 to-fuchsia-900 p-6 md:p-8 mb-6 text-white">
              <div className="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-gradient-to-br from-amber-400 to-pink-500 opacity-20 blur-3xl pointer-events-none" />
              <div className="relative">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-xs font-bold uppercase tracking-wider mb-3">
                  <FileText className="w-3 h-3 text-amber-300" />
                  Templates
                </div>
                <h2 className="text-2xl md:text-3xl font-bold mb-2">Ready-to-use formats for the artefacts you'll write.</h2>
                <p className="text-slate-300 text-sm md:text-base max-w-2xl">Open one, copy it into your tool of choice, and save the formatting headaches for someone else.</p>
              </div>
            </div>

            <div className="flex flex-col md:flex-row md:items-center gap-3 mb-6">
              <div className="relative flex-1">
                <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search templates…" className="w-full pl-11 pr-4 py-3 rounded-xl bg-white border border-slate-200 focus:outline-none focus:border-violet-400 transition text-slate-900 placeholder:text-slate-400 text-sm" />
              </div>
            </div>

            <div className="flex flex-wrap gap-2 mb-6">
              <button onClick={() => setTemplateFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${templateFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>All</button>
              {Object.entries(TEMPLATE_CATEGORIES).map(([key, cat]) => (
                <button key={key} onClick={() => setTemplateFilter(key)} className={`px-3 py-1.5 rounded-full text-xs font-bold transition inline-flex items-center gap-1.5 ${templateFilter === key ? `bg-gradient-to-r ${cat.gradient} text-white` : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
                  <cat.icon className="w-3 h-3" />
                  {cat.label}
                </button>
              ))}
            </div>

            <div className="grid md:grid-cols-2 gap-4 mb-12">
              {filteredTemplates.map((t) => {
                const cat = TEMPLATE_CATEGORIES[t.category];
                return (
                  <button key={t.id} onClick={() => handleTemplateClick(t)} className="text-left bg-white rounded-2xl p-5 border border-slate-200 hover:border-violet-300 hover:shadow-xl transition-all group">
                    <div className="flex items-start gap-3 mb-3">
                      <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center flex-shrink-0 shadow`}>
                        <cat.icon className="w-5 h-5 text-white" />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-0.5">{cat.label}</div>
                        <h3 className="font-bold text-slate-900 leading-tight group-hover:text-violet-700 transition">{t.title}</h3>
                      </div>
                    </div>
                    <p className="text-slate-600 text-sm leading-relaxed line-clamp-2">{t.description}</p>
                  </button>
                );
              })}
            </div>

            {filteredTemplates.length === 0 && (
              <div className="text-center py-12 text-slate-500">
                <Search className="w-8 h-8 mx-auto mb-3 text-slate-300" />
                <p>No templates match your search.</p>
              </div>
            )}
          </>
        )}

        {/* CHEAT SHEETS SECTION */}
        {section === 'cheatsheets' && (
          <>
            <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-blue-900 to-emerald-900 p-6 md:p-8 mb-6 text-white">
              <div className="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 opacity-20 blur-3xl pointer-events-none" />
              <div className="relative">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-xs font-bold uppercase tracking-wider mb-3">
                  <Database className="w-3 h-3 text-emerald-300" />
                  Cheat sheets
                </div>
                <h2 className="text-2xl md:text-3xl font-bold mb-2">Quick references for the tools you use every day.</h2>
                <p className="text-slate-300 text-sm md:text-base max-w-2xl">Excel formulas, SQL queries, statistical concepts, storytelling frameworks — pocket-sized cheat sheets you can refer to whenever.</p>
              </div>
            </div>

            <div className="flex flex-col md:flex-row md:items-center gap-3 mb-6">
              <div className="relative flex-1">
                <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search cheat sheets…" className="w-full pl-11 pr-4 py-3 rounded-xl bg-white border border-slate-200 focus:outline-none focus:border-violet-400 transition text-slate-900 placeholder:text-slate-400 text-sm" />
              </div>
            </div>

            <div className="flex flex-wrap gap-2 mb-6">
              <button onClick={() => setCheatSheetFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${cheatSheetFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>All</button>
              {Object.entries(CHEAT_SHEET_CATEGORIES).map(([key, cat]) => (
                <button key={key} onClick={() => setCheatSheetFilter(key)} className={`px-3 py-1.5 rounded-full text-xs font-bold transition inline-flex items-center gap-1.5 ${cheatSheetFilter === key ? `bg-gradient-to-r ${cat.gradient} text-white` : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
                  <cat.icon className="w-3 h-3" />
                  {cat.label}
                </button>
              ))}
            </div>

            <div className="grid md:grid-cols-2 gap-4 mb-12">
              {filteredCheatSheets.map((cs) => {
                const cat = CHEAT_SHEET_CATEGORIES[cs.category];
                return (
                  <button key={cs.id} onClick={() => handleCheatSheetClick(cs)} className="text-left bg-white rounded-2xl p-5 border border-slate-200 hover:border-emerald-300 hover:shadow-xl transition-all group">
                    <div className="flex items-start gap-3 mb-3">
                      <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center flex-shrink-0 shadow`}>
                        <cat.icon className="w-5 h-5 text-white" />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-0.5">{cat.label}</div>
                        <h3 className="font-bold text-slate-900 leading-tight group-hover:text-emerald-700 transition">{cs.title}</h3>
                      </div>
                    </div>
                    <p className="text-slate-600 text-sm leading-relaxed line-clamp-2">{cs.description}</p>
                  </button>
                );
              })}
            </div>

            {filteredCheatSheets.length === 0 && (
              <div className="text-center py-12 text-slate-500">
                <Search className="w-8 h-8 mx-auto mb-3 text-slate-300" />
                <p>No cheat sheets match your search.</p>
              </div>
            )}
          </>
        )}

        {/* ACADEMIC SECTION */}
        {section === 'academic' && (
          <>
            {/* Category landing */}
            {!browsingAcademicCategory && !search ? (
              <>
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-900 to-sky-900 p-6 md:p-8 mb-6 text-white">
                  <div className="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-gradient-to-br from-sky-400 to-violet-500 opacity-20 blur-3xl pointer-events-none" />
                  <div className="relative">
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-xs font-bold uppercase tracking-wider mb-3">
                      <Calculator className="w-3 h-3 text-sky-300" />
                      Academic
                    </div>
                    <h2 className="text-2xl md:text-3xl font-bold mb-2">Templates for school, university and study.</h2>
                    <p className="text-slate-300 text-sm md:text-base max-w-2xl">Plan a semester, outline an essay, prep for an exam, take better lecture notes. Pick a discipline to begin.</p>
                  </div>
                </div>

                <h2 className="text-2xl font-bold text-slate-900 mb-4">Choose a discipline</h2>
                <div className="grid md:grid-cols-2 gap-4 mb-12">
                  {Object.entries(ACADEMIC_CATEGORIES).map(([key, cat]) => {
                    const count = ACADEMIC_TEMPLATES.filter((t) => t.category === key).length;
                    return (
                      <button key={key} onClick={() => setBrowsingAcademicCategory(key)} className="relative overflow-hidden text-left bg-white rounded-3xl p-6 border border-slate-200 hover:border-sky-300 hover:shadow-2xl transition-all group">
                        <div className={`relative inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br ${cat.gradient} mb-4 shadow-lg`}>
                          <cat.icon className="w-6 h-6 text-white" />
                        </div>
                        <h3 className="relative font-bold text-slate-900 text-xl mb-1.5">{cat.label}</h3>
                        <p className="relative text-slate-600 text-sm leading-relaxed mb-4">{cat.description}</p>
                        <div className="relative flex items-center justify-between">
                          <span className="text-xs text-slate-500 font-semibold">{count} template{count === 1 ? '' : 's'}</span>
                          <ArrowRight className="w-4 h-4 text-slate-400 group-hover:text-sky-600 group-hover:translate-x-1 transition" />
                        </div>
                      </button>
                    );
                  })}
                </div>

                <div className="bg-white rounded-2xl p-4 border border-slate-200 mb-6">
                  <div className="relative">
                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search all academic templates…" className="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-sky-400 focus:bg-white transition text-slate-900 placeholder:text-slate-400 text-sm" />
                  </div>
                </div>
              </>
            ) : (
              <>
                {/* Category nav + search */}
                <div className="flex flex-col md:flex-row md:items-center gap-3 mb-6">
                  {browsingAcademicCategory && (
                    <button onClick={() => { setBrowsingAcademicCategory(null); setSearch(''); setAcademicFilter('all'); }} className="self-start flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-white transition">
                      <ArrowLeft className="w-4 h-4" />
                      All disciplines
                    </button>
                  )}
                  <div className="relative flex-1">
                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                    <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search academic templates…" className="w-full pl-11 pr-4 py-3 rounded-xl bg-white border border-slate-200 focus:outline-none focus:border-sky-400 transition text-slate-900 placeholder:text-slate-400 text-sm" />
                  </div>
                </div>

                {!browsingAcademicCategory && (
                  <div className="flex flex-wrap gap-2 mb-6">
                    <button onClick={() => setAcademicFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${academicFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>All</button>
                    {Object.entries(ACADEMIC_CATEGORIES).map(([key, cat]) => (
                      <button key={key} onClick={() => setAcademicFilter(key)} className={`px-3 py-1.5 rounded-full text-xs font-bold transition inline-flex items-center gap-1.5 ${academicFilter === key ? `bg-gradient-to-r ${cat.gradient} text-white` : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}>
                        <cat.icon className="w-3 h-3" />
                        {cat.short}
                      </button>
                    ))}
                  </div>
                )}

                {browsingAcademicCategory && (
                  <div className="mb-5">
                    {(() => {
                      const cat = ACADEMIC_CATEGORIES[browsingAcademicCategory];
                      return (
                        <div className="flex items-center gap-3">
                          <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center shadow-lg`}>
                            <cat.icon className="w-6 h-6 text-white" />
                          </div>
                          <div>
                            <h2 className="text-2xl font-bold text-slate-900">{cat.label}</h2>
                            <p className="text-slate-500 text-sm">{cat.description}</p>
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                )}

                {/* Template cards */}
                <div className="grid md:grid-cols-2 gap-4 mb-12">
                  {ACADEMIC_TEMPLATES.filter((t) => {
                    if (browsingAcademicCategory && t.category !== browsingAcademicCategory) return false;
                    if (!browsingAcademicCategory && academicFilter !== 'all' && t.category !== academicFilter) return false;
                    if (search) {
                      const q = search.toLowerCase();
                      return t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q);
                    }
                    return true;
                  }).map((t) => {
                    const cat = ACADEMIC_CATEGORIES[t.category];
                    return (
                      <button key={t.id} onClick={() => {
                        if (!currentUser) { setPendingAcademicTemplate(t); setShowAuthGate(true); return; }
                        setActiveAcademicTemplate(t);
                      }} className="text-left bg-white rounded-2xl p-5 border border-slate-200 hover:border-sky-300 hover:shadow-xl transition-all group">
                        <div className="flex items-start gap-3 mb-3">
                          <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center flex-shrink-0 shadow`}>
                            <cat.icon className="w-5 h-5 text-white" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-0.5">{cat.short}</div>
                            <h3 className="font-bold text-slate-900 leading-tight group-hover:text-sky-700 transition">{t.title}</h3>
                          </div>
                        </div>
                        <p className="text-slate-600 text-sm leading-relaxed line-clamp-2">{t.description}</p>
                      </button>
                    );
                  })}
                </div>
              </>
            )}
          </>
        )}

        {/* Footer */}
        <div className="text-center text-xs text-slate-400 py-8 border-t border-slate-200">
          <p>Work Playbooks · Installable offline app · Your data stays on this device.</p>
        </div>
      </div>

      {/* Template modal */}
      {activeTemplate && (
        <TemplateViewer template={activeTemplate} onClose={() => setActiveTemplate(null)} onDownload={downloadTemplate} categoryMap={TEMPLATE_CATEGORIES} />
      )}

      {/* Academic template modal */}
      {activeAcademicTemplate && (
        <AcademicTemplateViewer template={activeAcademicTemplate} onClose={() => setActiveAcademicTemplate(null)} onDownload={downloadAcademicTemplate} />
      )}

      {/* Cheat sheet modal (reuses TemplateViewer with cheat sheet category map) */}
      {activeCheatSheet && (
        <TemplateViewer template={activeCheatSheet} onClose={() => setActiveCheatSheet(null)} onDownload={downloadCheatSheet} categoryMap={CHEAT_SHEET_CATEGORIES} />
      )}

      {/* Auth gate modal */}
      {showAuthGate && (
        <AuthScreen
          users={users}
          onLogin={handleLogin}
          onSignUp={handleSignUp}
          onClose={() => { setShowAuthGate(false); setPendingPlaybook(null); setPendingTemplate(null); setPendingCheatSheet(null); setPendingAcademicTemplate(null); }}
          isModal={true}
          contextMessage={pendingPlaybook ? `Sign in to start "${pendingPlaybook.title}" and track your progress.` : pendingTemplate ? `Sign in to open "${pendingTemplate.title}".` : pendingCheatSheet ? `Sign in to open "${pendingCheatSheet.title}".` : pendingAcademicTemplate ? `Sign in to open "${pendingAcademicTemplate.title}".` : null}
        />
      )}

      {/* Install banner */}
      {showInstallBanner && installPrompt && (
        <InstallBanner onInstall={handleInstall} onDismiss={dismissInstall} />
      )}
    </div>
  );
}
// ==================== MOUNT ====================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
